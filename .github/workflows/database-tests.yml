name: Database security tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check tutor function types
        run: deno check --config supabase/functions/deno.json supabase/functions/tutor/index.ts
      - name: Test tutor rate limiting
        run: deno test --config supabase/functions/deno.json supabase/functions/tutor/rateLimit_test.ts
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Start local Supabase
        run: supabase start
      - name: Test Row Level Security policies
        run: supabase test db
